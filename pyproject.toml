[project]
name = "fastapiproject1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "fastapi>=0.141.1",
    "myapplication>=0.1.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings>=2.0",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "uuid>=1.30",
    "uvicorn>=0.52.4",
    "alembic>=1.19.2",
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "aiosqlite>=0.22,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
